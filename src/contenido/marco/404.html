<main id="primary" class="site-main">
	<div class="mbn-search">
		<div class="mbn-container mbn-search__container">
			<div class="mbn-search__header">
				<p class="mbn-search__count">Error 404</p>
				<h1 class="mbn-search__title">Página no encontrada</h1>
				<p class="mbn-search__intro">
					La página que buscas no existe o cambió de dirección. Puedes buscar lo que necesitas o ir a alguna de estas secciones.
				</p>
				<form class="mbn-search__form" role="search" action="/buscar/" method="get" aria-label="Buscar en el sitio">
					<label class="visually-hidden" for="mbn-search-field">Texto a buscar</label>
					<div class="input-group flex-nowrap mbn-search__group">
						<span class="input-group-text mbn-search__field-icon">
							<img
								src="/tema/images/components/icon-search.svg"
								alt=""
								aria-hidden="true"
								width="20"
								height="20"
							/>
						</span>
						<input
							id="mbn-search-field"
							class="form-control mbn-search__input"
							type="search"
							name="s"
							value=""
							placeholder="Ingrese texto"
							autocomplete="off"
							required
						/>
						<button class="btn mbn-search__button" type="submit">Buscar</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<section class="mbn-direct-access" aria-label="Secciones del sitio">
		<div class="mbn-direct-access__container">
			<ul class="mbn-direct-access__list" role="list" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));">
				<li class="mbn-direct-access__item">
					<a class="mbn-direct-access__card" href="/">
						<span class="mbn-direct-access__tile" aria-hidden="true">
							<img class="mbn-direct-access__icon" src="/uploads/2026/08/icon-villa.svg" width="36" height="36" alt="" aria-hidden="true" focusable="false" />
						</span>
						<span class="mbn-direct-access__text">Ir al inicio</span>
					</a>
				</li>
				<li class="mbn-direct-access__item">
					<a class="mbn-direct-access__card" href="/tramites/">
						<span class="mbn-direct-access__tile" aria-hidden="true">
							<img class="mbn-direct-access__icon" src="/uploads/2026/09/icon-assignment.svg" width="36" height="36" alt="" aria-hidden="true" focusable="false" />
						</span>
						<span class="mbn-direct-access__text">Trámites</span>
					</a>
				</li>
				<li class="mbn-direct-access__item">
					<a class="mbn-direct-access__card" href="/noticias/">
						<span class="mbn-direct-access__tile" aria-hidden="true">
							<img class="mbn-direct-access__icon" src="/tema/images/components/icon-description.svg" width="36" height="36" alt="" aria-hidden="true" focusable="false" />
						</span>
						<span class="mbn-direct-access__text">Noticias</span>
					</a>
				</li>
				<li class="mbn-direct-access__item">
					<a class="mbn-direct-access__card" href="/ciudadania/atencion-ciudadana/">
						<span class="mbn-direct-access__tile" aria-hidden="true">
							<img class="mbn-direct-access__icon" src="/uploads/2026/08/icon-person-outline.svg" width="36" height="36" alt="" aria-hidden="true" focusable="false" />
						</span>
						<span class="mbn-direct-access__text">Atención ciudadana</span>
					</a>
				</li>
			</ul>
		</div>
	</section>
</main>
